{% comment %}
Inicio, Avisos y Buscar son páginas; "Más" abre el menú. active_nav ("home", "notifications" o "search")
marca su destino y coloca el indicador (--ws-nav-index); en otras páginas ninguno se marca.
{% endcomment %}
<nav class="ws-bottom-nav" aria-label="Navegación principal" id="ws-bottom-nav"{% if active_nav == "notifications" %} style="--ws-nav-index: 1"{% elif active_nav == "search" %} style="--ws-nav-index: 2"{% endif %}>
  <div class="ws-bottom-nav__indicator" aria-hidden="true"{% if active_nav != "home" and active_nav != "notifications" and active_nav != "search" %} hidden{% endif %}></div>
  <a class="ws-nav-item text-decoration-none{% if active_nav == "home" %} is-active{% endif %}" href="{% url 'social:home' %}"{% if active_nav == "home" %} aria-current="page"{% endif %}>
    <i class="bx bx-home-alt ws-nav-item__off" aria-hidden="true"></i><i class="bx bxs-home ws-nav-item__on" aria-hidden="true"></i>
    <span>Inicio</span>
  </a>
  <a class="ws-nav-item text-decoration-none{% if active_nav == "notifications" %} is-active{% endif %}" href="{% url 'notifications' %}" data-ws-nav="notifications"{% if active_nav == "notifications" %} aria-current="page"{% endif %}>
    <i class="bx bx-bell ws-nav-item__off" aria-hidden="true"></i><i class="bx bxs-bell ws-nav-item__on" aria-hidden="true"></i>
    <span>Avisos</span>
  </a>
  <a class="ws-nav-item text-decoration-none{% if active_nav == "search" %} is-active{% endif %}" href="{% url 'social:search' %}" data-ws-nav="search"{% if active_nav == "search" %} aria-current="page"{% endif %}>
    <i class="bx bx-search ws-nav-item__off" aria-hidden="true"></i><i class="bx bx-search-alt ws-nav-item__on" aria-hidden="true"></i>
    <span>Buscar</span>
  </a>
  <button type="button" class="ws-nav-item" data-bs-toggle="offcanvas" data-bs-target="#ws-menu" aria-controls="ws-menu">
    <i class="bx bx-menu" aria-hidden="true"></i>
    <span>Más</span>
  </button>
</nav>
