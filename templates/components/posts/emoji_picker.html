{# Selector de emojis (Bootstrap Offcanvas inferior). reactions.js llena la cuadrícula desde /api/catalogs/emojis/. #}
<div class="offcanvas offcanvas-bottom rounded-top-4 ws-emoji-picker" tabindex="-1" id="ws-emoji-picker" aria-labelledby="ws-emoji-picker-title">
  <div class="offcanvas-header pb-2">
    <h2 class="offcanvas-title h6 fw-bold" id="ws-emoji-picker-title">Reaccionar</h2>
    <button type="button" class="btn-close" data-bs-dismiss="offcanvas" aria-label="Cerrar"></button>
  </div>
  <div class="offcanvas-body pt-0">
    <div class="ws-emoji-grid" data-emoji-grid></div>
  </div>
</div>
